name: Release

on:
  push:
    tags:
      - "*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npm test

      - run: npm run build

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/vkfix.user.js
